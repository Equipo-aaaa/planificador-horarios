<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: listas de prioridad</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/modulos/ficha.css" rel="stylesheet">
  <link href="../css/modulos/listas.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4" style="max-width: 640px;">
    <h1 class="h4 mb-1">Listas de prioridad</h1>
    <p class="text-secondary">
      Escenario 1. Arrastra las fichas desde el asa para reordenarlas: cada cambio
      imprime en la consola las preferencias nuevas y las muestra abajo.
    </p>

    <div id="listas"></div>

    <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
      <h2 class="h6 mb-0">Última preferencia emitida por <code>alCambiar</code></h2>
      <button id="restablecer" type="button" class="btn btn-sm btn-outline-secondary">Restablecer</button>
    </div>
    <pre id="salida" class="bg-white border rounded p-2 small" style="white-space: pre-wrap;">(todavía no has movido nada)</pre>
    <p id="error" class="text-danger mt-3" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  <script type="module">
    import { montarListasPrioridad } from "../js/vista/listas.js";

    const salida = document.getElementById("salida");
    const textoError = document.getElementById("error");

    function mostrarError(mensaje) {
      textoError.textContent = mensaje;
      textoError.hidden = false;
    }

    async function leerJSON(ruta) {
      const respuesta = await fetch(ruta);
      if (!respuesta.ok) throw new Error(`No se pudo leer ${ruta} (${respuesta.status})`);
      return respuesta.json();
    }

    try {
      const oferta = await leerJSON("../ejemplos/oferta-ejemplo.json");
      const materias = Array.isArray(oferta) ? oferta : oferta.materias;
      const preferencias = await leerJSON("../ejemplos/escenario-1-preferencias.json");
      if (!preferencias.materias) {
        throw new Error(`escenario-1-preferencias.json no trae "materias"; trae: ${Object.keys(preferencias).join(", ")}`);
      }

      const listas = montarListasPrioridad(document.getElementById("listas"), {
        materias,
        preferencias,
        descargada: oferta.descargada,
        alCambiar: (nuevas) => {
          console.log("alCambiar", nuevas);
          salida.textContent = nuevas.materias
            .map((p) => `${p.clave}: [${p.orden.join(", ")}]`)
            .join("\n");
        },
      });

      document.getElementById("restablecer").addEventListener("click", () => {
        listas.actualizar(materias, preferencias, oferta.descargada);
        salida.textContent = "(restablecido)";
      });
    } catch (error) {
      mostrarError(`No se pudo cargar el ejemplo: ${error.message}`);
    }
  </script>
</body>
</html>
