<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: gráfica de mediciones</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/modulos/grafica.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4">
    <h1 class="h4 mb-1">Gráfica de mediciones</h1>
    <p class="text-secondary">
      Mediciones <strong>inventadas</strong> (no salen de ninguna búsqueda real): sirven para ver
      que las dos gráficas dibujan una línea por algoritmo. La exhaustiva se detiene en 7 materias
      a propósito, como pasará en la página de análisis cuando se limite su máximo.
    </p>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="cargar" type="button" class="btn btn-sm btn-primary">Cargar mediciones</button>
      <button id="vaciar" type="button" class="btn btn-sm btn-outline-secondary">Vaciar</button>
    </div>

    <div id="grafica" class="bg-white border rounded p-3"></div>
    <p id="error" class="text-danger mt-3" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module">
    import { montarGrafica } from "../js/vista/grafica.js";

    function inventarMediciones() {
      const mediciones = [];
      const variaciones = [0.95, 1, 1.05];
      for (let materias = 2; materias <= 8; materias++) {
        for (const factor of variaciones) {
          const nodosBT = Math.round(12 * 1.9 ** materias * factor);
          mediciones.push({
            algoritmo: "backtracking",
            materias,
            nodos: nodosBT,
            combinaciones: Math.round(3 * 1.6 ** materias * factor),
            ms: nodosBT * 0.0004,
          });
          if (materias <= 7) {
            let nodosEx = 0;
            for (let nivel = 1; nivel <= materias; nivel++) nodosEx += 5 ** nivel;
            mediciones.push({
              algoritmo: "exhaustiva",
              materias,
              nodos: Math.round(nodosEx * factor),
              combinaciones: 5 ** materias,
              ms: nodosEx * 0.0004 * factor,
            });
          }
        }
      }
      return mediciones;
    }

    const textoError = document.getElementById("error");
    try {
      const grafica = montarGrafica(document.getElementById("grafica"));
      const mediciones = inventarMediciones();
      grafica.mostrar(mediciones);
      console.log("mediciones inventadas:", mediciones.length);

      document.getElementById("cargar").addEventListener("click", () => grafica.mostrar(mediciones));
      document.getElementById("vaciar").addEventListener("click", () => grafica.mostrar([]));
    } catch (error) {
      textoError.textContent = `No se pudo montar la gráfica: ${error.message}`;
      textoError.hidden = false;
    }
  </script>
</body>
</html>
