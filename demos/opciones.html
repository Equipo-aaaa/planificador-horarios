<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: generar y mostrar las opciones</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/cuadricula.css" rel="stylesheet">
  <link href="../css/modulos/opciones.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4" style="max-width: 980px">
    <h1 class="h5 mb-1">DI-07 · Generar y mostrar las opciones</h1>
    <p class="text-secondary small">
      Usa <code>oferta-ejemplo.json</code> y las preferencias del escenario elegido. Al presionar
      <b>Generar</b> se arma el problema, corre el backtracking y se compara el resultado con
      <code>escenario-N-resultado.json</code>. El escenario 3 debe avisar que Análisis y Bases de Datos chocan.
    </p>

    <div class="d-flex flex-wrap align-items-end gap-3 mb-3">
      <div>
        <label for="escenario" class="form-label small mb-1">Escenario</label>
        <select id="escenario" class="form-select">
          <option value="1">1: turno matutino</option>
          <option value="2">2: turno vespertino</option>
          <option value="3">3: con choque obligatorio</option>
        </select>
      </div>
      <p id="comparacion" class="small mb-2"></p>
    </div>

    <div class="p-3 border rounded" style="background: var(--superficie)">
      <div id="opciones"></div>
      <div id="cuadricula" class="mt-3"></div>
    </div>
    <p id="error" class="text-danger mt-3" hidden></p>
  </main>

  <script type="module">
    import { montarOpciones } from '../js/app/opciones.js';
    import { generarOpciones } from '../js/app/generar.js';
    import { montarCuadricula } from '../js/vista/cuadricula.js';

    const $ = (id) => document.getElementById(id);
    const leer = async (ruta) => {
      const respuesta = await fetch(ruta);
      if (!respuesta.ok) throw new Error(`No se pudo leer ${ruta} (${respuesta.status})`);
      return respuesta.json();
    };

    try {
      const oferta = await leer('../ejemplos/oferta-ejemplo.json');
      const cuadricula = montarCuadricula($('cuadricula'), {
        alEditar: (clave, nrc) => console.log('alEditar', clave, nrc),
      });

      const opciones = montarOpciones($('opciones'), {
        alGenerar: async () => {
          const n = $('escenario').value;
          const preferencias = await leer(`../ejemplos/escenario-${n}-preferencias.json`);
          const esperado = await leer(`../ejemplos/escenario-${n}-resultado.json`);
          const { resultado } = generarOpciones(oferta.materias, preferencias);
          opciones.mostrar(resultado, oferta.materias);

          // Misma comprobación que tests/pruebas-opciones.js, pero a la vista.
          const igual = JSON.stringify(resultado.opciones) === JSON.stringify(esperado.opciones);
          $('comparacion').className = `small mb-2 ${igual ? 'text-success' : 'text-danger'}`;
          $('comparacion').textContent = igual
            ? `✓ Igual a escenario-${n}-resultado.json`
            : `✗ Distinto de escenario-${n}-resultado.json (revisa la consola)`;
          if (!igual) console.log({ obtenido: resultado.opciones, esperado: esperado.opciones });
        },
        alElegir: (opcion, indice) => {
          console.log('alElegir', indice, opcion);
          if (opcion) cuadricula.mostrar(opcion, oferta.materias);
          else cuadricula.limpiar();
        },
      });
      opciones.permitirGenerar(true);

      $('escenario').addEventListener('change', () => {
        $('comparacion').textContent = '';
        opciones.marcarDesactualizado(true);
      });
    } catch (error) {
      $('error').textContent = `No se pudo cargar el ejemplo: ${error.message}`;
      $('error').hidden = false;
    }
  </script>
</body>
</html>
