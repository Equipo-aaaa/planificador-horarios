<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: panel de entrada</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/panel-entrada.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4" style="max-width: 760px;">
    <h1 class="h5 mb-1">Panel de entrada</h1>
    <p class="text-secondary small">
      Busca, agrega y quita materias: cada aviso del panel se imprime en la consola y abajo.
      Con Live Server no existen las funciones de Netlify, así que la búsqueda usa el respaldo
      (prueba "algoritmos" o "IL355"). Con <code>netlify dev</code> consulta SIIAU en vivo.
    </p>

    <div class="row g-4">
      <!-- Mismo ancho que la columna del buscador en index.html -->
      <div class="col-12 col-md-auto" style="width: 18rem;">
        <div id="panel"></div>
      </div>

      <div class="col">
        <div class="d-flex flex-wrap gap-2 mb-2">
          <button id="restaurar" type="button" class="btn btn-sm btn-outline-secondary">Probar establecer()</button>
          <button id="tema" type="button" class="btn btn-sm btn-outline-secondary">Tema claro / oscuro</button>
        </div>
        <h2 class="h6">Avisos del panel</h2>
        <pre id="salida" class="border rounded p-2 small" style="white-space: pre-wrap; min-height: 8rem;"></pre>
      </div>
    </div>
  </main>

  <script type="module">
    import { montarPanelEntrada } from "../js/entrada/panel.js";

    const salida = document.getElementById("salida");

    // Imprime cada callback en la consola y en la página, el más nuevo arriba.
    function registrar(nombre, ...datos) {
      console.log(nombre, ...datos);
      const resumen = datos.map((dato) => typeof dato === "string" ? dato : resumir(dato)).join(", ");
      salida.textContent = `${nombre}(${resumen})\n` + salida.textContent;
    }

    // Para no llenar la página con la oferta completa: la Materia se muestra
    // como su clave y la RespuestaOferta como su fuente.
    function resumir(dato) {
      if (dato?.clave) return `${dato.clave} ${dato.nombre}`;
      if (dato?.fuente) return `respuesta de ${dato.fuente}`;
      return JSON.stringify(dato);
    }

    const panel = montarPanelEntrada(document.getElementById("panel"), {
      alCambiarCiclo: (ciclo) => registrar("alCambiarCiclo", ciclo),
      alAgregarMateria: (materia, respuesta) => registrar("alAgregarMateria", materia, respuesta),
      alQuitarMateria: (clave) => registrar("alQuitarMateria", clave),
    });

    // Simula abrir la página con un avance guardado: dos materias de ejemplo.
    document.getElementById("restaurar").addEventListener("click", async () => {
      const oferta = await (await fetch("../ejemplos/oferta-ejemplo.json")).json();
      panel.establecer({ ciclo: "202620", materias: oferta.materias.slice(0, 2) });
      salida.textContent = "establecer(): 2 materias de ejemplo (no debe imprimir avisos)\n" + salida.textContent;
    });

    document.getElementById("tema").addEventListener("click", () => {
      const raiz = document.documentElement;
      raiz.dataset.bsTheme = raiz.dataset.bsTheme === "dark" ? "light" : "dark";
    });
  </script>
</body>
</html>
